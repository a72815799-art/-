name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 문법 검사
        run: npm run check
      - name: 테스트 (골든셋 · 규칙 경계값 · 콘텐츠 무결성)
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright 설치
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: 클래스 모드 브라우저 종단 테스트
        run: npm run e2e
