name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 문법 검사
        run: npm run check
      - name: 테스트 (골든셋 · 규칙 경계값 · 콘텐츠 무결성)
        run: npm test
