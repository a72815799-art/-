<title>MMPI 해석 수련실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* Layout: 상단 고정 내비 + 단일 작업 열(최대 1120px). 프로파일 차트는 전통 MMPI 프로파일 용지(격자, 붉은 65선)를 차용. */
:root{
  --bg:#F2F4F5; --surface:#FFFFFF; --sunk:#E8ECEF; --ink:#15202B; --muted:#56646F; --line:#D3DAE0;
  --accent:#1E5A87; --accent-soft:#E1ECF5; --plot:#B5372C; --ok:#2C7A4D; --warn:#9A6210; --stop:#B5372C;
  --ok-soft:#E3F1E8; --warn-soft:#F6ECDA; --stop-soft:#F6E1DE;
  --f-display:"Nanum Myeongjo", "Noto Serif KR", Georgia, serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E151B; --surface:#151F28; --sunk:#1B2731; --ink:#E1E8EE; --muted:#93A2AE; --line:#27363F;
  --accent:#7FB4DE; --accent-soft:#1A2D3C; --plot:#EE7D70; --ok:#62C18E; --warn:#E2A84C; --stop:#EE7D70;
  --ok-soft:#16301F; --warn-soft:#33270F; --stop-soft:#3A1A17; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#151F28; --sunk:#1B2731; --ink:#E1E8EE; --muted:#93A2AE; --line:#27363F;
  --accent:#7FB4DE; --accent-soft:#1A2D3C; --plot:#EE7D70; --ok:#62C18E; --warn:#E2A84C; --stop:#EE7D70;
  --ok-soft:#16301F; --warn-soft:#33270F; --stop-soft:#3A1A17; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; letter-spacing:-0.01em; line-height:1.3; margin:0}
h1{font-size:clamp(28px,4.4vw,40px); font-weight:800}
h2{font-size:24px; font-weight:800}
h3{font-size:18px; font-weight:700}
h4{font-size:15px; margin:22px 0 6px; font-weight:700}
p{margin:0 0 10px}
.mono,.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

header.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:9; background:var(--surface); border-bottom:1px solid var(--line)}
.top-in{max-width:1160px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); display:flex; align-items:center; gap:18px; min-height:56px}
.brand{display:flex; align-items:baseline; gap:8px; text-decoration:none; color:var(--ink); white-space:nowrap}
.brand b{font-family:var(--f-display); font-size:18px; font-weight:800}
.brand span{font-family:var(--f-mono); font-size:11px; color:var(--plot); letter-spacing:.06em}
nav.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none; text-decoration:none; color:var(--muted); padding:8px 11px; border-radius:7px; font-size:14px; font-weight:500}
nav.tabs a:hover{background:var(--sunk); color:var(--ink)}
nav.tabs a.on{color:var(--accent); background:var(--accent-soft); font-weight:600}

main{max-width:1160px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:28px 80px}
.eyebrow{font-family:var(--f-mono); font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.lede{color:var(--muted); max-width:68ch; font-size:15.5px}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
@media (max-width:860px){ .grid2,.grid3{grid-template-columns:minmax(0,1fr)} }
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px}
.panel.flat{background:transparent; border-style:dashed}
.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:500; font-size:14px; text-decoration:none; color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent); border-color:var(--accent); color:var(--surface)}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55; cursor:default}
.btn.sm{padding:5px 10px; font-size:13px}
.chip{display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:2px 9px; border-radius:99px; background:var(--sunk); color:var(--muted); font-weight:500; white-space:nowrap}
.chip.acc{background:var(--accent-soft); color:var(--accent)}
.chip.ok{background:var(--ok-soft); color:var(--ok)} .chip.warn{background:var(--warn-soft); color:var(--warn)} .chip.stop{background:var(--stop-soft); color:var(--stop)}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--surface); border:1px solid var(--line); border-radius:7px; padding:7px 10px; width:100%}
textarea{min-height:92px; resize:vertical; line-height:1.6}
label.f{display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); font-weight:500}

/* hero */
.hero{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:28px; align-items:center; margin-bottom:34px}
@media (max-width:860px){ .hero{grid-template-columns:minmax(0,1fr)} }
.hero p.lede{margin-top:12px}
.hero .chartwrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 10px 6px}
.level-list{display:flex; flex-direction:column; gap:10px}
.level{display:grid; grid-template-columns:56px minmax(0,1fr) auto; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px}
.level .lv{font-family:var(--f-mono); font-size:12px; color:var(--muted); text-align:center; line-height:1.2}
.level .lv b{display:block; font-family:var(--f-display); font-size:26px; color:var(--ink)}
.level h3{font-size:16px}
.level .goal{font-size:13.5px; color:var(--muted); margin:2px 0 6px}
.level .links{display:flex; flex-wrap:wrap; gap:6px}
.level .links a{font-size:12.5px; text-decoration:none; padding:2px 8px; border-radius:6px; border:1px solid var(--line); color:var(--ink)}
.level .links a.done{border-color:var(--ok); color:var(--ok)}
.meter{width:64px; height:6px; background:var(--sunk); border-radius:9px; overflow:hidden}
.meter i{display:block; height:100%; background:var(--accent)}
@media (max-width:560px){ .level{grid-template-columns:44px minmax(0,1fr)} .level .meterbox{grid-column:2} }

/* theory */
.module{max-width:76ch}
.module .body{font-size:15.5px}
.module ol,.module ul{padding-left:22px; margin:6px 0 12px}
.module li{margin:3px 0}
.tblwrap{overflow-x:auto}
table.tbl{border-collapse:collapse; width:100%; margin:8px 0 14px; font-size:14px}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top}
table.tbl th{font-weight:600; color:var(--muted); font-size:12.5px; background:var(--sunk)}
.callout{border-left:3px solid var(--plot); background:var(--surface); padding:12px 16px; border-radius:0 8px 8px 0; margin:16px 0; font-size:14.5px}
.steps{display:flex; flex-direction:column; gap:8px; margin:10px 0 16px; counter-reset:none}
.step{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 14px; font-size:14.5px}
.modlist{display:flex; flex-direction:column; gap:6px}
.modlist a{display:flex; justify-content:space-between; gap:12px; text-decoration:none; color:var(--ink); padding:10px 14px; border:1px solid var(--line); background:var(--surface); border-radius:8px}
.modlist a:hover{border-color:var(--accent)}
.modlist .m-meta{color:var(--muted); font-size:12.5px; white-space:nowrap}

/* scales */
.scale-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:0}
.scale-card summary{list-style:none; cursor:pointer; padding:14px 16px; display:grid; grid-template-columns:76px minmax(0,1fr) auto; gap:12px; align-items:baseline}
.scale-card summary::-webkit-details-marker{display:none}
.scale-card .ab{font-family:var(--f-mono); font-weight:600; color:var(--accent); font-size:15px}
.scale-card .nm{font-weight:600}
.scale-card .ms{grid-column:2/4; color:var(--muted); font-size:13.5px; margin-top:-4px}
.scale-card .in{padding:0 16px 16px 104px; font-size:14.5px}
@media (max-width:560px){ .scale-card .in{padding-left:16px} .scale-card summary{grid-template-columns:60px minmax(0,1fr)} .scale-card .ms{grid-column:1/3} .scale-card summary .chip{display:none} }
.bands{display:flex; flex-direction:column; gap:4px; margin:8px 0}
.bands div{display:grid; grid-template-columns:70px minmax(0,1fr); gap:10px}
.bands .k{font-family:var(--f-mono); font-size:12px; color:var(--muted); padding-top:2px}
.expert{background:var(--accent-soft); border-radius:8px; padding:10px 14px; margin-top:8px}
.expert b{color:var(--accent)}
.seg{display:flex; gap:4px; flex-wrap:wrap}
.seg button{border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:4px 12px; font-size:13px; cursor:pointer}
.seg button.on{background:var(--ink); border-color:var(--ink); color:var(--bg)}

/* codetypes */
.codegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px}
.code-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:6px}
.code-card:hover{border-color:var(--accent)}
.code-card .cn{font-family:var(--f-mono); font-size:20px; font-weight:600; color:var(--plot)}
.code-card .cc{font-size:13.5px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.code-detail ul{padding-left:20px; margin:4px 0 10px}

/* analyzer */
.az{display:grid; grid-template-columns:minmax(0,370px) minmax(0,1fr); gap:20px; align-items:start}
@media (max-width:960px){ .az{grid-template-columns:minmax(0,1fr)} }
.inputs details{border-top:1px solid var(--line); padding:8px 0}
.inputs summary{cursor:pointer; font-weight:600; font-size:14px; padding:4px 0}
.ingrid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px 8px; margin-top:8px}
.ingrid label{display:flex; flex-direction:column; font-size:11.5px; color:var(--muted); font-family:var(--f-mono)}
.ingrid input{padding:5px 6px; font-family:var(--f-mono); font-size:13.5px; text-align:right}
.ingrid input.hi{border-color:var(--plot); color:var(--plot); font-weight:600}
.stepbox{border:1px solid var(--line); border-radius:var(--r); background:var(--surface); overflow:hidden}
.stepbox .sh{display:flex; justify-content:space-between; gap:10px; align-items:center; padding:10px 16px; background:var(--sunk); font-weight:600; font-size:14.5px}
.stepbox .sh .n{font-family:var(--f-mono); color:var(--muted); margin-right:8px; font-size:12.5px}
.stepbox ul{list-style:none; padding:6px 16px 12px; margin:0; display:flex; flex-direction:column; gap:8px}
.stepbox li{display:grid; grid-template-columns:12px minmax(0,1fr); gap:10px; font-size:14.5px}
.stepbox li::before{content:""; width:8px; height:8px; border-radius:50%; margin-top:8px; background:var(--muted)}
.stepbox li.ok::before{background:var(--ok)} .stepbox li.warn::before{background:var(--warn)} .stepbox li.stop::before{background:var(--stop)} .stepbox li.info::before{background:var(--accent)}
.stepbox .sub{color:var(--muted); font-size:13.5px}
.chartwrap svg{display:block; width:100%; height:auto}
.vbadge{font-size:13px}

/* cases */
.casegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px}
.case-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; text-decoration:none; color:var(--ink); display:flex; flex-direction:column; gap:8px}
.case-card:hover{border-color:var(--accent)}
.case-card .demo{font-size:13px; color:var(--muted)}
.facts{display:grid; grid-template-columns:90px minmax(0,1fr); gap:6px 14px; font-size:14.5px}
.facts dt{color:var(--muted); font-size:13px; padding-top:2px}
.facts dd{margin:0}
.scoretbl{overflow-x:auto}
.scoretbl table{border-collapse:collapse; font-family:var(--f-mono); font-size:12.5px; font-variant-numeric:tabular-nums}
.scoretbl th,.scoretbl td{padding:3px 7px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap}
.scoretbl th{color:var(--muted); font-weight:500}
.scoretbl td.h{color:var(--plot); font-weight:600}
.scoretbl .gl{color:var(--muted); text-align:left; font-family:var(--f-body); font-size:12px}
.answer label.f{color:var(--ink); font-size:14px; font-weight:600}
.answer label.f small{color:var(--muted); font-weight:400}
.kp{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px}
.kp li{display:grid; grid-template-columns:22px 86px minmax(0,1fr); gap:8px; font-size:14px; align-items:start}
.kp .mk{font-family:var(--f-mono); font-weight:600}
.kp .hit .mk{color:var(--ok)} .kp .miss .mk{color:var(--stop)}
.kp .dm{font-size:12px; color:var(--muted); padding-top:2px}
@media (max-width:560px){ .kp li{grid-template-columns:22px minmax(0,1fr)} .kp .dm{display:none} }
.scorebar{height:10px; border-radius:9px; background:var(--sunk); overflow:hidden}
.scorebar i{display:block; height:100%; background:var(--ok)}
.md{font-size:14.5px}
.md h2,.md h3{font-family:var(--f-body); font-size:16px; font-weight:700; margin:16px 0 6px}
.md ul,.md ol{padding-left:20px; margin:4px 0 10px}
.md table{border-collapse:collapse; width:100%; font-size:13.5px; margin:6px 0 12px}
.md th,.md td{border-bottom:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top}
.md th{background:var(--sunk); font-weight:600}
.md .tblwrap{overflow-x:auto}
.thinking{color:var(--muted); font-style:italic}
.thinking::after{content:"…"; animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){ .thinking::after{animation:none} }
.note{font-size:13px; color:var(--muted)}

/* quiz */
.q{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px}
.q .opts{display:flex; flex-direction:column; gap:6px; margin-top:10px}
.q .opts button{text-align:left; border:1px solid var(--line); background:var(--bg); padding:9px 12px; border-radius:8px; cursor:pointer}
.q .opts button:hover:not(:disabled){border-color:var(--accent)}
.q .opts button.right{border-color:var(--ok); background:var(--ok-soft)}
.q .opts button.wrong{border-color:var(--stop); background:var(--stop-soft)}
.q .ex{margin-top:10px; font-size:14px; padding:10px 12px; background:var(--accent-soft); border-radius:8px}

/* mentor */
.chat{display:flex; flex-direction:column; gap:12px}
.msg{max-width:88%; padding:10px 14px; border-radius:12px; font-size:14.5px}
.msg.u{align-self:flex-end; background:var(--accent); color:var(--surface); border-bottom-right-radius:4px; white-space:pre-wrap}
.msg.a{align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:4px}
.sugg{display:flex; flex-wrap:wrap; gap:6px}
.sugg button{font-size:13px; border:1px solid var(--line); background:var(--surface); padding:5px 10px; border-radius:99px; cursor:pointer}
footer{border-top:1px solid var(--line); margin-top:40px; padding-top:16px; font-size:12.5px; color:var(--muted)}
</style>
