# 로그인 필요한 사이트 설정. sites.yaml 로 복사해서 사용하세요.
# 비밀번호는 여기 쓰지 말고 .env 의 환경변수 이름만 적습니다.
sites:
  # 예 1) 학교 도서관 EZproxy - DOI 논문을 프록시 경유로 받기
  - name: my_library
    domains: [ezproxy.example.ac.kr]
    login_page_url: https://ezproxy.example.ac.kr/login
    login_url: https://ezproxy.example.ac.kr/login
    username_field: user
    password_field: pass
    username_env: LIB_USER
    password_env: LIB_PASS
    fail_pattern: "(?i)invalid|incorrect|로그인 실패"
    proxy_prefix: "https://ezproxy.example.ac.kr/login?url="
    use_for_doi: true

  # 예 2) 로그인 폼이 복잡한 사이트(2단계 인증, SSO 등)는 브라우저 쿠키를 내보내서 사용
  #   크롬 확장 "Get cookies.txt LOCALLY" 등으로 Netscape 형식 cookies.txt 저장
  - name: some_publisher
    domains: [sciencedirect.com, ieeexplore.ieee.org]
    cookies_file: ./cookies/publisher_cookies.txt
